name: Build Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting checks
        id: lint
        continue-on-error: true
        run: |
          # Since no specific linter is configured, we'll do basic checks
          echo "Checking JavaScript syntax..."
          find src -name "*.js" -type f | while read file; do
            node -c "$file" || exit 1
          done
          echo "✅ Linting passed"

      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/results
          if [ "${{ steps.lint.outcome }}" == "success" ]; then
            echo "PASS" > /tmp/results/linting.txt
            echo "All linting checks passed successfully." > /tmp/results/linting-details.txt
          else
            echo "FAIL" > /tmp/results/linting.txt
            echo "Linting checks failed. See logs for details." > /tmp/results/linting-details.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-result
          path: /tmp/results/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit-test
        continue-on-error: true
        run: |
          # Run grep pattern tests as unit tests
          bash scripts/test-grep-patterns.sh

      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/results
          if [ "${{ steps.unit-test.outcome }}" == "success" ]; then
            echo "PASS" > /tmp/results/unit-tests.txt
            echo "All unit tests passed successfully." > /tmp/results/unit-tests-details.txt
          else
            echo "FAIL" > /tmp/results/unit-tests.txt
            echo "Unit tests failed. See logs for details." > /tmp/results/unit-tests-details.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-result
          path: /tmp/results/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        id: integration-test
        continue-on-error: true
        run: |
          # Run git SHA injection test as integration test
          bash scripts/test-git-sha-injection.sh

      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/results
          if [ "${{ steps.integration-test.outcome }}" == "success" ]; then
            echo "PASS" > /tmp/results/integration-tests.txt
            echo "All integration tests passed successfully." > /tmp/results/integration-tests-details.txt
          else
            echo "FAIL" > /tmp/results/integration-tests.txt
            echo "Integration tests failed. See logs for details." > /tmp/results/integration-tests-details.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-result
          path: /tmp/results/

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start local server
        run: |
          npm run dev:local &
          echo $! > /tmp/server.pid

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8787/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run API tests
        id: api-test
        continue-on-error: true
        run: bash scripts/run-all-api-tests.sh

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi

      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/results
          if [ "${{ steps.api-test.outcome }}" == "success" ]; then
            echo "PASS" > /tmp/results/api-tests.txt
            echo "All API tests passed successfully." > /tmp/results/api-tests-details.txt
          else
            echo "FAIL" > /tmp/results/api-tests.txt
            echo "API tests failed. See logs for details." > /tmp/results/api-tests-details.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-result
          path: /tmp/results/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        id: e2e-test
        continue-on-error: true
        run: |
          # Run auth gate and balance tests as E2E tests
          bash scripts/test-auth-gate.sh
          bash scripts/test-user-balance.sh

      - name: Save result
        if: always()
        run: |
          mkdir -p /tmp/results
          if [ "${{ steps.e2e-test.outcome }}" == "success" ]; then
            echo "PASS" > /tmp/results/e2e-tests.txt
            echo "All E2E tests passed successfully." > /tmp/results/e2e-tests-details.txt
          else
            echo "FAIL" > /tmp/results/e2e-tests.txt
            echo "E2E tests failed. See logs for details." > /tmp/results/e2e-tests-details.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-result
          path: /tmp/results/

  generate-report:
    name: Generate Build Report
    runs-on: ubuntu-latest
    needs: [linting, unit-tests, integration-tests, api-tests, e2e-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/results

      - name: Generate HTML report
        run: |
          mkdir -p report
          
          # Get git SHA and timestamp
          GIT_SHA="${{ github.sha }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          
          # Collect results
          declare -A RESULTS
          declare -A DETAILS
          
          for test in linting unit-tests integration-tests api-tests e2e-tests; do
            result_file="/tmp/results/${test}-result/${test}.txt"
            details_file="/tmp/results/${test}-result/${test}-details.txt"
            
            if [ -f "$result_file" ]; then
              RESULTS[$test]=$(cat "$result_file")
              if [ -f "$details_file" ]; then
                DETAILS[$test]=$(cat "$details_file")
              else
                DETAILS[$test]="No details available"
              fi
            else
              RESULTS[$test]="UNKNOWN"
              DETAILS[$test]="Result file not found"
            fi
          done
          
          # Count failures
          FAIL_COUNT=0
          for test in linting unit-tests integration-tests api-tests e2e-tests; do
            if [ "${RESULTS[$test]}" == "FAIL" ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          
          # Determine background color
          if [ $FAIL_COUNT -eq 0 ]; then
            BG_COLOR="#ffffff"
          elif [ $FAIL_COUNT -eq 1 ]; then
            BG_COLOR="#fff3cd"  # Yellow
          else
            BG_COLOR="#f8d7da"  # Red
          fi
          
          # Generate main report page
          cat > report/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Report - HashBin.org</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        .metadata {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-size: 14px;
        }
        .metadata p {
            margin: 5px 0;
        }
        .job-list {
            list-style: none;
            padding: 0;
        }
        .job-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            transition: box-shadow 0.2s;
        }
        .job-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .job-status {
            font-size: 24px;
            margin-right: 15px;
            min-width: 30px;
        }
        .job-name {
            flex: 1;
            font-weight: 500;
            color: #333;
        }
        .job-link {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .job-link:hover {
            text-decoration: underline;
        }
        .summary {
            margin: 30px 0;
            padding: 20px;
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            border-radius: 5px;
        }
        .pass { color: #28a745; }
        .fail { color: #dc3545; }
        code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body style="background-color: BG_COLOR_PLACEHOLDER;">
    <h1>🔨 Build Report</h1>
    
    <div class="metadata">
        <p><strong>Repository:</strong> REPO_PLACEHOLDER</p>
        <p><strong>Commit SHA:</strong> <code>GIT_SHA_PLACEHOLDER</code></p>
        <p><strong>Generated:</strong> TIMESTAMP_PLACEHOLDER</p>
        <p><strong>Run ID:</strong> <a href="https://github.com/REPO_PLACEHOLDER/actions/runs/RUN_ID_PLACEHOLDER" target="_blank">RUN_ID_PLACEHOLDER</a></p>
    </div>
    
    <h2>📊 Test Results</h2>
    <ul class="job-list">
        <li class="job-item">
            <span class="job-status">LINTING_STATUS_PLACEHOLDER</span>
            <span class="job-name">Linting</span>
            <a href="linting.html" class="job-link">View Details →</a>
        </li>
        <li class="job-item">
            <span class="job-status">UNIT_TESTS_STATUS_PLACEHOLDER</span>
            <span class="job-name">Unit Tests</span>
            <a href="unit-tests.html" class="job-link">View Details →</a>
        </li>
        <li class="job-item">
            <span class="job-status">INTEGRATION_TESTS_STATUS_PLACEHOLDER</span>
            <span class="job-name">Integration Tests</span>
            <a href="integration-tests.html" class="job-link">View Details →</a>
        </li>
        <li class="job-item">
            <span class="job-status">API_TESTS_STATUS_PLACEHOLDER</span>
            <span class="job-name">API Tests</span>
            <a href="api-tests.html" class="job-link">View Details →</a>
        </li>
        <li class="job-item">
            <span class="job-status">E2E_TESTS_STATUS_PLACEHOLDER</span>
            <span class="job-name">E2E Tests</span>
            <a href="e2e-tests.html" class="job-link">View Details →</a>
        </li>
    </ul>
    
    <div class="summary">
        <h3>Summary</h3>
        <p>Total Jobs: <strong>5</strong></p>
        <p class="pass">Passed: <strong>PASSED_COUNT_PLACEHOLDER</strong></p>
        <p class="fail">Failed: <strong>FAILED_COUNT_PLACEHOLDER</strong></p>
    </div>
</body>
</html>
EOF
          
          # Replace placeholders
          sed -i "s|BG_COLOR_PLACEHOLDER|$BG_COLOR|g" report/index.html
          sed -i "s|REPO_PLACEHOLDER|$REPO|g" report/index.html
          sed -i "s|GIT_SHA_PLACEHOLDER|$GIT_SHA|g" report/index.html
          sed -i "s|TIMESTAMP_PLACEHOLDER|$TIMESTAMP|g" report/index.html
          sed -i "s|RUN_ID_PLACEHOLDER|$RUN_ID|g" report/index.html
          
          # Replace status icons
          for test in linting unit-tests integration-tests api-tests e2e-tests; do
            TEST_UPPER=$(echo "$test" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            if [ "${RESULTS[$test]}" == "PASS" ]; then
              sed -i "s|${TEST_UPPER}_STATUS_PLACEHOLDER|✅|g" report/index.html
            else
              sed -i "s|${TEST_UPPER}_STATUS_PLACEHOLDER|❌|g" report/index.html
            fi
          done
          
          # Replace counts
          PASSED_COUNT=$((5 - FAIL_COUNT))
          sed -i "s|PASSED_COUNT_PLACEHOLDER|$PASSED_COUNT|g" report/index.html
          sed -i "s|FAILED_COUNT_PLACEHOLDER|$FAIL_COUNT|g" report/index.html
          
          # Generate detail pages for each job
          for test in linting unit-tests integration-tests api-tests e2e-tests; do
            TEST_NAME=$(echo "$test" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
            STATUS="${RESULTS[$test]}"
            DETAIL="${DETAILS[$test]}"
            
            if [ "$STATUS" == "PASS" ]; then
              STATUS_ICON="✅"
              STATUS_TEXT="PASSED"
              STATUS_CLASS="pass"
            else
              STATUS_ICON="❌"
              STATUS_TEXT="FAILED"
              STATUS_CLASS="fail"
            fi
            
            cat > "report/${test}.html" << DETAIL_EOF
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${TEST_NAME} - Build Report</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: ${BG_COLOR};
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        .status {
            font-size: 24px;
            margin: 20px 0;
        }
        .status.pass { color: #28a745; }
        .status.fail { color: #dc3545; }
        .details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #007bff;
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .metadata {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-size: 14px;
        }
        .metadata p {
            margin: 5px 0;
        }
        code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>${TEST_NAME}</h1>
    
    <div class="metadata">
        <p><strong>Repository:</strong> ${REPO}</p>
        <p><strong>Commit SHA:</strong> <code>${GIT_SHA}</code></p>
        <p><strong>Generated:</strong> ${TIMESTAMP}</p>
        <p><strong>Run ID:</strong> <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}" target="_blank">${RUN_ID}</a></p>
    </div>
    
    <div class="status ${STATUS_CLASS}">
        <strong>Status:</strong> ${STATUS_ICON} ${STATUS_TEXT}
    </div>
    
    <h2>Details</h2>
    <div class="details">${DETAIL}</div>
    
    <a href="index.html" class="back-link">← Back to Build Report</a>
</body>
</html>
DETAIL_EOF
          done
          
          echo "✅ Build report generated in report/ directory"
          ls -la report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          force_orphan: true
