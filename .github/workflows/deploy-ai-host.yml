name: Deploy reviewed AI host
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-host-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ai-host-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: curtcox/Tools-for-pages-with-state-in-URL-fragments
          ref: v0.4.0
          path: kit
      - run: npm ci
      - run: npx vitest run scripts/deploy-ai-host.test.js
      - name: Verify published kit and stage exact pilot allowlist
        run: node scripts/deploy-ai-host.mjs kit
      - name: Deploy after owner approval
        run: node node_modules/wrangler/bin/wrangler.js deploy --config build-reports/ai-host/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
