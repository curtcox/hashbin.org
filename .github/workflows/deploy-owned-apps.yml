name: Deploy first-party app domains
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to publish
        required: true
        default: all
        type: choice
        options: [all, remaining-ai, pages-preview, pages, python, manim, gnuplot, sheets, modl, diagram, upload, textpad, audio, r, livelier, apptron, gripeline, slides]
permissions:
  contents: read
concurrency:
  group: owned-app-domains
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hashbin.org
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hashbin.org/package-lock.json
      - name: Check out public client sources
        run: |
          for repo in pages PythonOnline ManimOnline GnuplotOnline sheets modl AudioOnline R livelier apptron gripeline slidev; do
            folder="$repo"
            if [ "$repo" = GnuplotOnline ]; then folder=GnuPlotOnline; fi
            git clone --depth 1 "https://github.com/curtcox/$repo.git" "$folder"
          done
      - uses: actions/setup-python@v5
        if: inputs.app == 'gripeline' || inputs.app == 'all' || inputs.app == 'remaining-ai'
        with:
          python-version: '3.12'
      - name: Build gripeline editor public assets
        if: inputs.app == 'gripeline' || inputs.app == 'all' || inputs.app == 'remaining-ai'
        working-directory: gripeline
        run: python3 site/build.py
      - uses: actions/setup-node@v4
        if: inputs.app == 'slides' || inputs.app == 'all'
        with:
          node-version: '24'
      - name: Build Slidev Online release from its pinned pnpm workspace
        if: inputs.app == 'slides' || inputs.app == 'all'
        working-directory: slidev
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm -C online/runtime build
          node online/scripts/build.mjs --release
      - uses: actions/setup-node@v4
        if: inputs.app == 'slides' || inputs.app == 'all'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hashbin.org/package-lock.json
      - name: Prepare locked Apptron site
        if: inputs.app == 'apptron' || inputs.app == 'all' || inputs.app == 'remaining-ai'
        working-directory: apptron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          GITHUB_REPOSITORY=curtcox/apptron scripts/fetch-runtime.sh
          npm run build
      - run: npm ci
        working-directory: hashbin.org
      - name: Validate deployment tooling
        run: npx vitest run scripts/deploy-owned-apps.test.js
        working-directory: hashbin.org
      - name: Publish selected static app
        run: node scripts/deploy-owned-apps.mjs "$APP" --deploy
        working-directory: hashbin.org
        env:
          APP: ${{ inputs.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
