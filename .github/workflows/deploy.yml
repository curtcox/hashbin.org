name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with reporter
        run: bash scripts/test-reporter.sh

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hashbin.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject git SHA into frontend HTML files
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Git SHA: $GIT_SHA"

          # Inject SHA into HTML files
          bash scripts/inject-git-sha.sh "$GIT_SHA"
          echo "✅ Git SHA injected into HTML files"

      - name: Inject git SHA into worker source code
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Git SHA: $GIT_SHA"

          # Inject SHA into worker source code
          # This ensures code changes with each commit, forcing wrangler to redeploy
          bash scripts/inject-git-sha-code.sh "$GIT_SHA"

          # Verify the injection worked
          echo ""
          echo "=== Verifying source code modification ==="
          echo "Looking for BUNDLED_GIT_SHA in src/index.js:"
          grep "BUNDLED_GIT_SHA" src/index.js

          if grep -q "BUNDLED_GIT_SHA = '$GIT_SHA'" src/index.js; then
            echo "✅ Git SHA correctly injected into source code"
          else
            echo "❌ ERROR: Git SHA injection failed!"
            echo "Expected to find: BUNDLED_GIT_SHA = '$GIT_SHA'"
            exit 1
          fi

      - name: Create R2 buckets
        run: |
          create_bucket() {
            local bucket_name=$1
            echo "Creating bucket '$bucket_name'..."
            output=$(npx wrangler r2 bucket create "$bucket_name" 2>&1) && return 0
            if echo "$output" | grep -q "\[code: 10004\]"; then
              echo "Bucket '$bucket_name' already exists (this is OK)"
              return 0
            fi
            echo "ERROR creating bucket '$bucket_name':"
            echo "$output"
            return 1
          }
          create_bucket hashbin-content-prod
          create_bucket hashbin-backups-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify required secrets
        run: |
          echo "Verifying required secrets are configured..."
          
          # Check for required secrets
          MISSING_SECRETS=""
          
          if [ -z "$CLERK_SECRET_KEY" ]; then
            MISSING_SECRETS="$MISSING_SECRETS CLERK_SECRET_KEY"
          fi
          
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            MISSING_SECRETS="$MISSING_SECRETS CLERK_PUBLISHABLE_KEY"
          fi
          
          if [ -z "$API_KEY_ENCRYPTION_KEY" ]; then
            MISSING_SECRETS="$MISSING_SECRETS API_KEY_ENCRYPTION_KEY"
          fi
          
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            MISSING_SECRETS="$MISSING_SECRETS STRIPE_SECRET_KEY"
          fi
          
          if [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
            MISSING_SECRETS="$MISSING_SECRETS STRIPE_WEBHOOK_SECRET"
          fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ ERROR: The following required secrets are missing:$MISSING_SECRETS"
            echo ""
            echo "Please configure these secrets in your GitHub repository settings:"
            echo "Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "For more information, see docs/api-keys-setup.md"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Configure Clerk secrets
        run: |
          echo "Configuring Clerk secrets..."
          echo "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY
          echo "$CLERK_PUBLISHABLE_KEY" | npx wrangler secret put CLERK_PUBLISHABLE_KEY
          echo "✅ Clerk secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Configure Stripe secrets
        run: |
          echo "Configuring Stripe secrets..."
          echo "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY
          echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          echo "✅ Stripe secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Configure API key encryption secret
        run: |
          echo "Configuring API key encryption secret..."
          echo "$API_KEY_ENCRYPTION_KEY" | npx wrangler secret put API_KEY_ENCRYPTION_KEY
          echo "✅ API key encryption secret configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}

      - name: Verify wrangler.toml for binding conflicts
        run: |
          echo "Checking wrangler.toml for potential binding conflicts..."
          
          # Check if GIT_SHA is defined in [vars] section
          # sed pattern: /^\[vars\]/,/^\[/ matches from [vars] to next section
          # {/^\[vars\]/p; /^\[/!p;} prints [vars] line and all lines not starting with [
          # This extracts only [vars] section content, excluding next section header
          if sed -n '/^\[vars\]/,/^\[/{/^\[vars\]/p; /^\[/!p;}' wrangler.toml | grep -q 'GIT_SHA'; then
            echo "❌ ERROR: GIT_SHA is defined in wrangler.toml [vars] section"
            echo "This will conflict with the GIT_SHA secret configuration."
            echo "Please remove GIT_SHA from the [vars] section in wrangler.toml"
            exit 1
          fi
          
          echo "✅ No binding conflicts detected"

      - name: Configure GIT_SHA as secret
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Configuring GIT_SHA as secret: $GIT_SHA"
          echo "$GIT_SHA" | npx wrangler secret put GIT_SHA
          echo "✅ GIT_SHA secret configured: $GIT_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: List configured secrets (diagnostic)
        run: npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          echo "=== Wrangler version ==="
          npx wrangler --version

          echo ""
          echo "=== Source code before deployment ==="
          grep "BUNDLED_GIT_SHA" src/index.js

          echo ""
          echo "=== Running wrangler deploy ==="
          # Capture output to extract workers.dev URL
          DEPLOY_OUTPUT=$(npx wrangler deploy --outdir=.wrangler-output 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract workers.dev URL from deploy output
          WORKERS_DEV_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*workers.dev' | head -1)
          echo ""
          echo "Extracted workers.dev URL: $WORKERS_DEV_URL"
          echo "WORKERS_DEV_URL=$WORKERS_DEV_URL" >> $GITHUB_ENV

          echo ""
          echo "=== Verifying bundled output contains git SHA ==="
          GIT_SHA=$(git rev-parse HEAD)
          if grep -q "$GIT_SHA" .wrangler-output/index.js; then
            echo "✅ Git SHA found in bundled output: $GIT_SHA"
          else
            echo "❌ ERROR: Git SHA NOT found in bundled output!"
            echo "Searching for any SHA-like strings in bundle:"
            grep -o "BUNDLED_GIT_SHA[^,]*" .wrangler-output/index.js | head -3 || echo "BUNDLED_GIT_SHA not found"
            echo ""
            echo "First 500 chars of bundle:"
            head -c 500 .wrangler-output/index.js
            exit 1
          fi

          echo ""
          echo "=== Deployment complete ==="
          ls -la .wrangler-output/ 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment via workers.dev (immediate check)
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Checking workers.dev URL immediately after deploy..."
          echo "Expected SHA: $GIT_SHA"
          echo "Workers.dev URL: $WORKERS_DEV_URL"

          if [ -z "$WORKERS_DEV_URL" ]; then
            echo "❌ ERROR: Could not determine workers.dev URL from deployment"
            exit 1
          fi

          # Try the health endpoint on workers.dev
          echo ""
          echo "Fetching /health from $WORKERS_DEV_URL..."
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" "${WORKERS_DEV_URL}/health")
          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:[0-9]*$//')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Workers.dev health check failed with HTTP $HTTP_CODE"
            echo "This may indicate the worker failed to start!"
            # Don't exit - continue to check custom domain
          else
            # Check if gitSha is in the response
            if echo "$BODY" | grep -q "gitSha"; then
              DEPLOYED_SHA=$(echo "$BODY" | grep -o '"gitSha"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)".*/\1/')
              echo "Workers.dev deployed SHA: $DEPLOYED_SHA"
              if [ "$DEPLOYED_SHA" = "$GIT_SHA" ]; then
                echo "✅ Workers.dev shows correct SHA!"
              else
                echo "⚠️ Workers.dev SHA mismatch: expected $GIT_SHA, got $DEPLOYED_SHA"
              fi
            else
              echo "❌ Workers.dev response missing gitSha field!"
              echo "The NEW code is not running on workers.dev"
            fi
          fi

          # Show recent deployments
          echo ""
          echo "Recent deployments:"
          npx wrangler deployments list 2>&1 || echo "Could not list deployments"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify routes are configured
        run: |
          echo "=== Checking worker routes for hashbin.org zone ==="

          # Get routes from Cloudflare API
          ROUTES_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          echo "Routes configured for zone:"
          echo "$ROUTES_RESPONSE" | jq '.' 2>/dev/null || echo "$ROUTES_RESPONSE"

          # Check if our worker is in the routes
          if echo "$ROUTES_RESPONSE" | grep -q "hashbin-worker"; then
            echo "✅ hashbin-worker found in routes"
          else
            echo "❌ WARNING: hashbin-worker NOT found in routes!"
            echo "The custom domain may be pointing to a different worker"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Purge Cloudflare cache
        run: |
          echo "Purging Cloudflare cache to ensure fresh content is served..."
          bash scripts/purge-cloudflare-cache.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Wait for deployment propagation
        run: sleep 10

      - name: Verify deployment - Custom domain
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Expected git SHA: $GIT_SHA"
          echo "Testing custom domain hashbin.org..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin.org/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health endpoint returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "❌ Health check failed - status not healthy"
            exit 1
          fi

          # Verify git SHA
          DEPLOYED_SHA=$(echo "$BODY" | grep -o '"gitSha"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)".*/\1/')
          echo "Deployed git SHA: $DEPLOYED_SHA"
          
          if [ "$DEPLOYED_SHA" != "$GIT_SHA" ]; then
            echo "❌ Git SHA mismatch: expected $GIT_SHA, got $DEPLOYED_SHA"
            exit 1
          fi
          
          echo "✅ Git SHA verified: $GIT_SHA"

          if ! echo "$BODY" | grep -q '"environment"[[:space:]]*:[[:space:]]*"production"'; then
            echo "⚠️  Environment field shows unexpected value (non-critical)"
          fi

          echo "✅ Custom domain verified"

      - name: Verify git SHA in HTML files
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "Verifying git SHA in HTML files..."
          echo "Expected SHA: $GIT_SHA"

          PAGES=(
            "/"
            "/upload.html"
            "/dashboard.html"
            "/api-keys.html"
            "/info.html"
          )

          MAX_RETRIES=3
          RETRY_DELAY=5

          for PAGE in "${PAGES[@]}"; do
            echo ""
            echo "Checking $PAGE..."
            SUCCESS=false

            for ((i=1; i<=MAX_RETRIES; i++)); do
              # Use cache-busting headers
              HTML_RESPONSE=$(curl -s -H "Cache-Control: no-cache" -H "Pragma: no-cache" "https://hashbin.org$PAGE?_=$(date +%s)")

              if echo "$HTML_RESPONSE" | grep -q "<!-- git-sha: $GIT_SHA -->"; then
                echo "✅ Git SHA found in HTML: $GIT_SHA ($PAGE)"
                SUCCESS=true
                break
              else
                echo "Attempt $i/$MAX_RETRIES: SHA not found, waiting ${RETRY_DELAY}s..."
                if [ $i -lt $MAX_RETRIES ]; then
                  sleep $RETRY_DELAY
                fi
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Git SHA not found in HTML for $PAGE after $MAX_RETRIES attempts"
              echo "Expected: <!-- git-sha: $GIT_SHA -->"
              # Show what SHA is actually in the file
              FOUND_SHA=$(echo "$HTML_RESPONSE" | grep -o '<!-- git-sha: [^>]*-->' | head -1)
              echo "Found: $FOUND_SHA"
              exit 1
            fi
          done

          echo ""
          echo "✅ All HTML files verified"

      - name: Verify deployment - Workers.dev URL
        continue-on-error: true
        env:
          WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if [ -z "$WORKERS_SUBDOMAIN" ]; then
            echo "⏭️  Skipping workers.dev verification (CLOUDFLARE_WORKERS_SUBDOMAIN not set)"
            exit 0
          fi
          echo "Testing worker on workers.dev..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin-worker.${WORKERS_SUBDOMAIN}.workers.dev/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️  Workers.dev URL returned HTTP $HTTP_CODE"
            echo "This may be expected if workers.dev is not enabled"
            exit 0
          fi

          if echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "✅ Workers.dev URL verified"
          else
            echo "⚠️  Workers.dev responding but health check failed"
          fi

      - name: Deployment verification summary
        run: |
          echo "=========================================="
          echo "✅ Production Deployment Successful"
          echo "=========================================="
          echo "Custom domain: https://hashbin.org (VERIFIED)"
          echo "Environment: production"
          echo ""
          echo "Optional: To enable workers.dev URL verification,"
          echo "add CLOUDFLARE_WORKERS_SUBDOMAIN secret with your"
          echo "workers subdomain from Cloudflare dashboard."
          echo "=========================================="

# Note: Smoke tests run automatically via workflow_run trigger
# in .github/workflows/smoke-test.yml after this workflow completes
