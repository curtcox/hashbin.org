name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with reporter
        run: bash scripts/test-reporter.sh

  deploy-dev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create R2 buckets (development)
        run: |
          create_bucket() {
            local bucket_name=$1
            echo "Creating bucket '$bucket_name'..."
            output=$(npx wrangler r2 bucket create "$bucket_name" 2>&1) && return 0
            if echo "$output" | grep -q "\[code: 10004\]"; then
              echo "Bucket '$bucket_name' already exists (this is OK)"
              return 0
            fi
            echo "ERROR creating bucket '$bucket_name':"
            echo "$output"
            return 1
          }
          create_bucket hashbin-content-dev
          create_bucket hashbin-backups-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (development)
        run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Clerk secrets (development)
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "⚠️  Skipping Clerk secrets configuration (secrets not set)"
            exit 0
          fi
          echo "Configuring Clerk secrets for development..."
          echo "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --env development
          echo "$CLERK_PUBLISHABLE_KEY" | npx wrangler secret put CLERK_PUBLISHABLE_KEY --env development
          echo "✅ Clerk secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Configure Stripe secrets (development)
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "⚠️  Skipping Stripe secrets configuration (secrets not set)"
            exit 0
          fi
          echo "Configuring Stripe secrets for development..."
          echo "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env development
          echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env development
          echo "✅ Stripe secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Wait for deployment propagation
        run: sleep 10

      - name: Verify deployment - Root endpoint
        run: |
          echo "Testing root endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin-worker-dev.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Root endpoint returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! echo "$BODY" | grep -q "HashBin.org API"; then
            echo "❌ Response does not contain expected service name"
            exit 1
          fi

          echo "✅ Root endpoint verified"

      - name: Verify deployment - Health endpoint
        run: |
          echo "Testing health endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin-worker-dev.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health endpoint returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "❌ Health check failed - status not healthy"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"environment"[[:space:]]*:[[:space:]]*"development"'; then
            echo "❌ Wrong environment returned"
            exit 1
          fi

          echo "✅ Health endpoint verified"

      - name: Deployment verification summary
        run: |
          echo "=========================================="
          echo "✅ Development Deployment Successful"
          echo "=========================================="
          echo "Worker URL: https://hashbin-worker-dev.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "Root endpoint: VERIFIED"
          echo "Health endpoint: VERIFIED"
          echo "Environment: development"
          echo "=========================================="

  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hashbin.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create R2 buckets (production)
        run: |
          create_bucket() {
            local bucket_name=$1
            echo "Creating bucket '$bucket_name'..."
            output=$(npx wrangler r2 bucket create "$bucket_name" 2>&1) && return 0
            if echo "$output" | grep -q "\[code: 10004\]"; then
              echo "Bucket '$bucket_name' already exists (this is OK)"
              return 0
            fi
            echo "ERROR creating bucket '$bucket_name':"
            echo "$output"
            return 1
          }
          create_bucket hashbin-content-prod
          create_bucket hashbin-backups-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (production)
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Clerk secrets (production)
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "⚠️  Skipping Clerk secrets configuration (secrets not set)"
            exit 0
          fi
          echo "Configuring Clerk secrets for production..."
          echo "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --env production
          echo "$CLERK_PUBLISHABLE_KEY" | npx wrangler secret put CLERK_PUBLISHABLE_KEY --env production
          echo "✅ Clerk secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Configure Stripe secrets (production)
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "⚠️  Skipping Stripe secrets configuration (secrets not set)"
            exit 0
          fi
          echo "Configuring Stripe secrets for production..."
          echo "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env production
          echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env production
          echo "✅ Stripe secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Wait for deployment propagation
        run: sleep 10

      - name: Verify deployment - Custom domain
        run: |
          echo "Testing custom domain hashbin.org..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin.org/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health endpoint returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "❌ Health check failed - status not healthy"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"environment"[[:space:]]*:[[:space:]]*"production"'; then
            echo "❌ Wrong environment returned"
            exit 1
          fi

          echo "✅ Custom domain verified"

      - name: Verify deployment - Workers.dev URL
        continue-on-error: true
        env:
          WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if [ -z "$WORKERS_SUBDOMAIN" ]; then
            echo "⏭️  Skipping workers.dev verification (CLOUDFLARE_WORKERS_SUBDOMAIN not set)"
            exit 0
          fi
          echo "Testing production worker on workers.dev..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hashbin-worker-prod.${WORKERS_SUBDOMAIN}.workers.dev/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️  Workers.dev URL returned HTTP $HTTP_CODE"
            echo "This may be expected if workers.dev is not enabled"
            exit 0
          fi

          if echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "✅ Workers.dev URL verified"
          else
            echo "⚠️  Workers.dev responding but health check failed"
          fi

      - name: Deployment verification summary
        run: |
          echo "=========================================="
          echo "✅ Production Deployment Successful"
          echo "=========================================="
          echo "Custom domain: https://hashbin.org (VERIFIED)"
          echo "Environment: production"
          echo ""
          echo "Optional: To enable workers.dev URL verification,"
          echo "add CLOUDFLARE_WORKERS_SUBDOMAIN secret with your"
          echo "workers subdomain from Cloudflare dashboard."
          echo "=========================================="

# Note: Smoke tests run automatically via workflow_run trigger
# in .github/workflows/smoke-test.yml after this workflow completes
