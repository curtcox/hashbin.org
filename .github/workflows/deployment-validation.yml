name: Deployment Validation

on:
  # Run on schedule - daily at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'
  
  # Manual trigger with parameters
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to validate'
        required: false
        default: 'https://hashbin.org'
        type: string
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean
      skip_auth_tests:
        description: 'Skip authentication tests'
        required: false
        default: false
        type: boolean
  
  # Run after deployment completes
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types:
      - completed
    branches:
      - main

env:
  DEFAULT_TARGET_URL: https://hashbin.org

jobs:
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    # Skip if triggered by failed deployment
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for deployment propagation
        if: github.event_name == 'workflow_run'
        run: sleep 30
      
      - name: Set configuration variables
        id: config
        run: |
          # Determine target URL
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_URL="${{ inputs.target_url }}"
            VERBOSE="${{ inputs.verbose }}"
            SKIP_AUTH_TESTS="${{ inputs.skip_auth_tests }}"
          else
            TARGET_URL="${{ env.DEFAULT_TARGET_URL }}"
            VERBOSE="false"
            SKIP_AUTH_TESTS="false"
          fi
          
          echo "target_url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "verbose=$VERBOSE" >> $GITHUB_OUTPUT
          echo "skip_auth_tests=$SKIP_AUTH_TESTS" >> $GITHUB_OUTPUT
          
          # Get expected git SHA for workflow_run trigger
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "expected_git_sha=$EXPECTED_SHA" >> $GITHUB_OUTPUT
          fi
          
          echo "Configuration:"
          echo "  Target URL: $TARGET_URL"
          echo "  Verbose: $VERBOSE"
          echo "  Skip Auth Tests: $SKIP_AUTH_TESTS"
          if [ -n "$EXPECTED_SHA" ]; then
            echo "  Expected Git SHA: $EXPECTED_SHA"
          fi
      
      - name: Install dependencies
        run: |
          # Ensure jq is installed for JSON parsing
          sudo apt-get update -qq
          sudo apt-get install -y jq curl
      
      - name: Run validation tests
        id: validation
        env:
          TARGET_URL: ${{ steps.config.outputs.target_url }}
          VERBOSE: ${{ steps.config.outputs.verbose }}
          SKIP_AUTH_TESTS: ${{ steps.config.outputs.skip_auth_tests }}
          EXPECTED_GIT_SHA: ${{ steps.config.outputs.expected_git_sha }}
          VALIDATION_API_KEY: ${{ secrets.VALIDATION_API_KEY }}
        run: |
          echo "Starting validation tests..."
          echo "Target: $TARGET_URL"
          
          bash scripts/validation/run-all-validations.sh
      
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-${{ github.run_id }}
          path: |
            *.log
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Create validation summary
        if: always()
        run: |
          echo "## 🔍 Deployment Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target URL:** ${{ steps.config.outputs.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.config.outputs.expected_git_sha }}" ]; then
            echo "**Expected Git SHA:** \`${{ steps.config.outputs.expected_git_sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            echo "### ✅ All validation tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Validation tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the logs above for details on which tests failed." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Validation completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
      
      - name: Validation status
        if: always()
        run: |
          echo "=========================================="
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            echo "✅ Deployment validation PASSED"
          else
            echo "❌ Deployment validation FAILED"
            exit 1
          fi
          echo "=========================================="
