name: Local API Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Local API Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start local server
        run: |
          npm run dev:local -- --var DOWNLOAD_TOKEN_SECRET:local-ci-only --var OAUTH_SIGNING_KEY:local-oauth-ci-only --var ADMIN_USER_ID:local_admin &
          echo $! > /tmp/server.pid

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8787/health > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          echo "⚠️ Checking server logs:"
          # Try to get any error output from wrangler
          pgrep -af wrangler || echo "No wrangler process found"
          exit 1

      - name: Run API Tests
        run: bash scripts/run-all-api-tests.sh
        env:
          ADMIN_USER: local_admin

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E browser tests
        # Reuses the dev:local server started above (see playwright.config.js)
        run: npm run test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
