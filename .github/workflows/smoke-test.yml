name: Smoke Test

on:
  # Run on demand (production is the only environment)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production

  # Run after deployment workflow completes
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types:
      - completed
    branches:
      - main

  # Run on schedule (optional - every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    # Skip if triggered by failed deployment
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Wait for deployment propagation
        if: github.event_name == 'workflow_run'
        run: sleep 30

      - name: Verify all three origins and credential refusals
        # Scheduled runs compare HTML to the live health SHA. Deploy jobs also
        # require their exact github.sha before reporting success.
        run: npm run verify:production
