name: Smoke Test

on:
  # Run on demand
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

  # Run after deployment workflow completes
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types:
      - completed
    branches:
      - main
      - develop

  # Run on schedule (optional - every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

env:
  PRODUCTION_URL: https://hashbin.org

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    # Skip if triggered by failed deployment
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.head_branch }}" == "main" ]; then
              echo "target=production" >> $GITHUB_OUTPUT
            else
              echo "target=development" >> $GITHUB_OUTPUT
            fi
          else
            echo "target=production" >> $GITHUB_OUTPUT
          fi

      - name: Set target URL
        id: url
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.env.outputs.target }}" == "production" ]; then
            echo "base_url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
          else
            DEV_URL="https://hashbin-worker-dev.${ACCOUNT_ID}.workers.dev"
            echo "base_url=$DEV_URL" >> $GITHUB_OUTPUT
          fi

      - name: Wait for deployment propagation
        if: github.event_name == 'workflow_run'
        run: sleep 30

      # ============================================
      # Basic Health Check
      # ============================================
      - name: Test - Basic Health Endpoint
        id: health
        run: |
          echo "Testing ${{ steps.url.outputs.base_url }}/health"
          RESPONSE=$(curl -sf -w "\n%{http_code}" "${{ steps.url.outputs.base_url }}/health" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          BODY_B64=$(printf '%s' "$BODY" | base64 | tr -d '\n')
          echo "body_b64=$BODY_B64" >> $GITHUB_OUTPUT
          echo "::notice::Health endpoint OK"

      # ============================================
      # Clerk Integration Tests
      # ============================================
      - name: Test - Clerk Integration Health
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)

          # Check Clerk is in health response
          if ! echo "$BODY" | jq -e '.checks.clerk' > /dev/null 2>&1; then
            echo "::error::Clerk health check not found in response"
            exit 1
          fi

          CLERK_STATUS=$(echo "$BODY" | jq -r '.checks.clerk.status')
          TARGET_ENV="${{ steps.env.outputs.target }}"
          
          # Production must have Clerk operational
          if [ "$TARGET_ENV" == "production" ]; then
            if [ "$CLERK_STATUS" != "operational" ]; then
              echo "::error::Clerk status is $CLERK_STATUS (expected operational in production)"
              CLERK_DETAILS=$(echo "$BODY" | jq '.checks.clerk.details')
              echo "Details: $CLERK_DETAILS"
              exit 1
            fi
            echo "::notice::Clerk integration operational in production"
          else
            # Development can be down/degraded/operational
            if [ "$CLERK_STATUS" == "operational" ]; then
              echo "::notice::Clerk integration operational in development"
            elif [ "$CLERK_STATUS" == "degraded" ]; then
              echo "::warning::Clerk partially configured in development"
            else
              echo "::warning::Clerk not configured in development (this is OK)"
            fi
          fi

      - name: Test - Clerk Session Endpoint (Unauthenticated)
        run: |
          # Should return 401 for unauthenticated request
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.url.outputs.base_url }}/api/auth/session" || printf '000')

          if [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Session endpoint returned $HTTP_CODE (expected 401 for unauthenticated)"
            exit 1
          fi

          echo "::notice::Auth endpoint correctly returns 401 for unauthenticated requests"

      # ============================================
      # OAuth Integration Tests
      # ============================================
      - name: Test - OAuth Signing Key Health
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)
          TARGET_ENV="${{ steps.env.outputs.target }}"

          OAUTH_CONFIGURED=$(echo "$BODY" | jq -r '.checks.environment.details.oauthSigningKeyConfigured // "false"')
          echo "oauthSigningKeyConfigured: $OAUTH_CONFIGURED"

          if [ "$TARGET_ENV" == "production" ] && [ "$OAUTH_CONFIGURED" != "true" ]; then
            echo "::error::OAuth signing key is not configured in production"
            exit 1
          fi

          if [ "$TARGET_ENV" != "production" ] && [ "$OAUTH_CONFIGURED" != "true" ]; then
            echo "::warning::OAuth signing key is not configured in non-production environment"
          else
            echo "::notice::OAuth signing key health check passed"
          fi

      # ============================================
      # Stripe Integration Tests
      # ============================================
      - name: Test - Stripe Integration Health
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)

          # Check Stripe is in health response
          if ! echo "$BODY" | jq -e '.checks.stripe' > /dev/null 2>&1; then
            echo "::warning::Stripe health check not found in response"
            exit 0
          fi

          STRIPE_STATUS=$(echo "$BODY" | jq -r '.checks.stripe.status')
          TARGET_ENV="${{ steps.env.outputs.target }}"

          # Production should have Stripe operational for payments
          if [ "$TARGET_ENV" == "production" ]; then
            if [ "$STRIPE_STATUS" == "operational" ]; then
              echo "::notice::Stripe integration operational in production"
            elif [ "$STRIPE_STATUS" == "degraded" ]; then
              echo "::warning::Stripe partially configured in production"
              STRIPE_DETAILS=$(echo "$BODY" | jq '.checks.stripe.details')
              echo "Details: $STRIPE_DETAILS"
            else
              echo "::warning::Stripe not configured in production (payments disabled)"
              STRIPE_DETAILS=$(echo "$BODY" | jq '.checks.stripe.details')
              echo "Details: $STRIPE_DETAILS"
            fi
          else
            # Development can be down/degraded/operational
            if [ "$STRIPE_STATUS" == "operational" ]; then
              echo "::notice::Stripe integration operational in development"
            elif [ "$STRIPE_STATUS" == "degraded" ]; then
              echo "::warning::Stripe partially configured in development"
            else
              echo "::notice::Stripe not configured in development (this is OK)"
            fi
          fi

      # ============================================
      # R2 Storage Tests
      # ============================================
      - name: Test - R2 Storage Health
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)

          R2_STATUS=$(echo "$BODY" | jq -r '.checks.r2.status')
          if [ "$R2_STATUS" != "operational" ]; then
            echo "::error::R2 status is $R2_STATUS (expected operational)"
            R2_DETAILS=$(echo "$BODY" | jq '.checks.r2.details')
            echo "Details: $R2_DETAILS"
            exit 1
          fi

          echo "::notice::R2 storage operational"

      # ============================================
      # Durable Objects Tests
      # ============================================
      - name: Test - Durable Objects Health
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)

          DO_STATUS=$(echo "$BODY" | jq -r '.checks.durableObjects.status')
          if [ "$DO_STATUS" != "operational" ]; then
            echo "::error::Durable Objects status is $DO_STATUS (expected operational)"
            DO_DETAILS=$(echo "$BODY" | jq '.checks.durableObjects.details')
            echo "Details: $DO_DETAILS"
            exit 1
          fi

          echo "::notice::Durable Objects operational"

      # ============================================
      # Deployment Verification Tests
      # ============================================
      - name: Test - Git SHA in Health Endpoint
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)
          
          # Check git SHA is present in health response
          if ! echo "$BODY" | jq -e '.gitSha' > /dev/null 2>&1; then
            echo "::error::gitSha field not found in health response"
            exit 1
          fi
          
          GIT_SHA=$(echo "$BODY" | jq -r '.gitSha')
          echo "Deployed git SHA: $GIT_SHA"
          
          if [ "$GIT_SHA" == "unknown" ] || [ -z "$GIT_SHA" ]; then
            echo "::error::gitSha is not set properly"
            exit 1
          fi
          
          echo "::notice::Git SHA present in health endpoint: $GIT_SHA"

      - name: Test - Git SHA in HTML Comments
        run: |
          BODY=$(printf '%s' '${{ steps.health.outputs.body_b64 }}' | base64 --decode)
          GIT_SHA=$(echo "$BODY" | jq -r '.gitSha')
          
          # Fetch the index page and check for git SHA comment
          HTML_RESPONSE=$(curl -sf "${{ steps.url.outputs.base_url }}/" || printf 'ERROR')
          
          if [ "$HTML_RESPONSE" == "ERROR" ]; then
            echo "::error::Failed to fetch HTML page"
            exit 1
          fi
          
          if echo "$HTML_RESPONSE" | grep -q "<!-- git-sha: $GIT_SHA -->"; then
            echo "::notice::Git SHA found in HTML comments: $GIT_SHA"
          else
            echo "::error::Git SHA not found in HTML comments (expected: $GIT_SHA)"
            exit 1
          fi

      # ============================================
      # API Endpoint Tests
      # ============================================
      - name: Test - Root Endpoint
        run: |
          RESPONSE=$(curl -sf "${{ steps.url.outputs.base_url }}/" || printf 'ERROR')

          if [ "$RESPONSE" == "ERROR" ]; then
            echo "::error::Root endpoint failed to respond"
            exit 1
          fi

          if ! echo "$RESPONSE" | grep -q "HashBin"; then
            echo "::error::Root endpoint missing expected content"
            exit 1
          fi

          echo "::notice::Root endpoint OK"

      - name: Test - Public Endpoints Accessible
        run: |
          # Test calculate retention endpoint (public)
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"size_bytes": 1048576, "retention_months": 1}' \
            "${{ steps.url.outputs.base_url }}/api/payments/calculate" || printf '000')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Calculate endpoint returned $HTTP_CODE"
          else
            echo "::notice::Public calculate endpoint OK"
          fi

      # ============================================
      # Summary
      # ============================================
      - name: Smoke Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Smoke Test Results"
          echo "=========================================="
          echo "Environment: ${{ steps.env.outputs.target }}"
          echo "URL: ${{ steps.url.outputs.base_url }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "=========================================="
