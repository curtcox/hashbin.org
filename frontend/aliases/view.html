<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Look up one exact alias and review its public change history.">
  <title>Alias information - HashBin.org</title>
  <link rel="icon" href="/img/hashbin-logo.png">
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/auth.css">
  <style>.alias-form { display: grid; gap: .8rem; margin: 1rem 0; } .alias-form input { padding: .6rem; width: 100%; } .alias-form label { display: grid; gap: .3rem; } #alias-info { overflow-wrap: anywhere; } #alias-actions { margin: 1rem 0; }</style>
</head>
<body>
  <header class="nav-header"></header>
  <main><div class="container">
    <h1>Alias information</h1><p><a href="/dashboard/aliases/">Manage your aliases</a> · <a href="/docs/aliases.html">Alias guide</a></p>
    <form id="alias-lookup" class="alias-form"><label>Exact name <input id="lookup-name" required maxlength="63" autocomplete="off"></label><button class="btn btn-secondary">Look up</button></form>
    <p id="alias-message" role="status"></p>
    <section id="alias-info" class="card" hidden></section>
    <section id="alias-actions"></section>
    <section id="alias-history" class="card" hidden><h2>Public history</h2><p>The last 100 value and ownership changes. Owner identities are private. Resolution changes can take up to a minute.</p><ol id="history-list"></ol></section>
  </div></main>
  <script type="module" src="/js/app.js"></script><script type="module" src="/js/alias-view.js"></script>
</body>
</html>
