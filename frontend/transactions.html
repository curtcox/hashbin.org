<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transaction History - HashBin.org">
  <title>Transaction History - HashBin.org</title>
  <link rel="icon" href="/img/hashbin-logo.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  
  <style>
    /* Transaction-specific styles */
    .transaction-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    
    .transaction-table th,
    .transaction-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--color-border, #e5e7eb);
    }
    
    .transaction-table th {
      background: var(--color-surface-light, #f9fafb);
      font-weight: 600;
      color: var(--color-text, #1f2937);
    }
    
    .transaction-table tr:hover {
      background: var(--color-surface-light, #f9fafb);
    }
    
    .transaction-failed {
      background: #fef2f2 !important;
    }
    
    .amount-in {
      color: #10b981;
      font-weight: 600;
    }
    
    .amount-out {
      color: #ef4444;
      font-weight: 600;
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      margin-left: 0.5rem;
    }
    
    .status-failed {
      background: #fecaca;
      color: #991b1b;
    }
    
    .cid-link {
      font-family: monospace;
      font-size: 0.875rem;
      word-break: break-all;
    }
    
    .date-cell {
      font-family: monospace;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    
    .amount-cell {
      white-space: nowrap;
    }
    
    .balance-cell {
      white-space: nowrap;
      font-weight: 500;
    }
    
    .details-cell {
      font-size: 0.875rem;
    }
    
    .details-cell > div {
      margin-bottom: 0.25rem;
    }
    
    .failure-reason {
      color: #991b1b;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-text-light, #6b7280);
    }
    
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding: 1rem;
      background: var(--color-surface-light, #f9fafb);
      border-radius: 8px;
    }
    
    .pagination-info {
      font-weight: 500;
    }
    
    .filter-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    
    .filter-controls label {
      font-weight: 500;
      margin-right: 0.5rem;
    }
    
    .filter-controls select {
      padding: 0.5rem 1rem;
      border: 1px solid var(--color-border, #e5e7eb);
      border-radius: 4px;
      background: white;
      font-size: 1rem;
    }
    
    .export-link {
      margin-left: auto;
    }
    
    /* Mobile responsive */
    @media (max-width: 768px) {
      .transaction-table {
        display: block;
        overflow-x: auto;
      }
      
      .transaction-table th,
      .transaction-table td {
        padding: 0.75rem;
        font-size: 0.875rem;
      }
      
      .details-cell {
        max-width: 200px;
      }
      
      .filter-controls {
        flex-direction: column;
        align-items: stretch;
      }
      
      .export-link {
        margin-left: 0;
      }
      
      .pagination {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <header class="nav-header"></header>

  <!-- Main Content -->
  <main>
    <div class="container">
      <div class="dashboard-layout">
        <!-- Dashboard Sidebar -->
        <aside class="dashboard-sidebar">
          <nav>
            <a href="/dashboard.html">
              <span class="nav-icon">📊</span>
              <span>Overview</span>
            </a>
            <a href="/api-keys.html">
              <span class="nav-icon">🔑</span>
              <span>API Keys</span>
            </a>
            <a href="/dashboard/uploads/">
              <span class="nav-icon">📦</span>
              <span>My Uploads</span>
            </a>
            <a href="/dashboard/suppliers/">
              <span class="nav-icon">🔗</span>
              <span>Suppliers</span>
            </a>
            <a href="/deposit.html">
              <span class="nav-icon">💰</span>
              <span>Add Funds</span>
            </a>
            <a href="/transactions.html" class="nav-active">
              <span class="nav-icon">💳</span>
              <span>Transactions</span>
            </a>
            <a href="#" onclick="return false;" style="cursor: not-allowed; opacity: 0.6;">
              <span class="nav-icon">⚙️</span>
              <span>Account Settings</span>
              <span class="coming-soon">(Coming Soon)</span>
            </a>
            <a href="/terms.html">
              <span class="nav-icon">📄</span>
              <span>Terms of Service</span>
            </a>
          </nav>
        </aside>

        <!-- Transaction History Content -->
        <div class="dashboard-content">
          <h1>Transaction History</h1>
          
          <div class="card">
            <!-- Filter Controls -->
            <div class="filter-controls">
              <div>
                <label for="type-filter">Filter by type:</label>
                <select id="type-filter">
                  <option value="">All Transactions</option>
                  <option value="deposit">Deposits</option>
                  <option value="upload_payment">Content Uploads</option>
                  <option value="cid_extension">Retention Extensions</option>
                  <option value="donation_received">Donations</option>
                  <option value="rate_limit_purchase">Bandwidth Purchases</option>
                </select>
              </div>
              
              <div class="export-link">
                <a href="/api/balance/history?limit=1000" target="_blank" class="btn btn-secondary" title="Open API endpoint with up to 1000 transactions">
                  📥 Export All (API)
                </a>
              </div>
            </div>
            
            <!-- Transaction List -->
            <div id="transaction-list">
              <div style="display: flex; align-items: center; gap: 1rem; padding: 2rem;">
                <div class="spinner"></div>
                <span>Loading transactions...</span>
              </div>
            </div>
            
            <!-- Pagination -->
            <div id="pagination-controls"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 HashBin.org | Open Source | 
      <a href="/docs/">Documentation</a> | 
      <a href="https://github.com/curtcox/hashbin.org" target="_blank">GitHub</a> |
      <a href="/sitemap.html">Site Map</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { requireAuth } from './js/auth-gate.js';
    import { 
      fetchTransactions, 
      renderTransactionList, 
      renderPagination 
    } from './js/transactions.js';
    
    // Protect this page - require authentication
    await requireAuth();
    
    // State
    let currentOffset = 0;
    let currentLimit = 20;
    let currentType = null;
    
    // Load and display transactions
    async function loadTransactions() {
      const listEl = document.getElementById('transaction-list');
      const paginationEl = document.getElementById('pagination-controls');
      
      try {
        // Show loading state
        listEl.innerHTML = `
          <div style="display: flex; align-items: center; gap: 1rem; padding: 2rem;">
            <div class="spinner"></div>
            <span>Loading transactions...</span>
          </div>
        `;
        
        // Fetch transactions
        const data = await fetchTransactions({
          limit: currentLimit,
          offset: currentOffset,
          type: currentType
        });
        
        // Render transactions
        renderTransactionList(data.transactions, listEl);
        
        // Render pagination
        renderPagination(
          data.total, 
          currentLimit, 
          currentOffset, 
          handlePageChange, 
          paginationEl
        );
        
      } catch (error) {
        console.error('Failed to load transactions:', error);
        listEl.innerHTML = `
          <div class="alert alert-error">
            <p>Failed to load transaction history. Please try refreshing the page.</p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem; color: #991b1b;">
              ${error.message}
            </p>
          </div>
        `;
      }
    }
    
    // Handle page change
    function handlePageChange(newOffset) {
      currentOffset = newOffset;
      loadTransactions();
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // Handle type filter change
    document.getElementById('type-filter').addEventListener('change', (e) => {
      currentType = e.target.value || null;
      currentOffset = 0; // Reset to first page
      loadTransactions();
    });
    
    // Initial load
    loadTransactions();
  </script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/banner.js"></script>
</body>
</html>
