name = "hashbin-worker-prod"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (frontend files)
[assets]
directory = "./frontend"
binding = "ASSETS"

# Production environment variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "warn"
CONTENT_DOMAIN = "256t.us"

# Production routes
routes = [
  { pattern = "hashbin.org/*", zone_name = "hashbin.org" },
  { pattern = "www.hashbin.org/*", zone_name = "hashbin.org" }
]
workers_dev = true

# Note: Add these secrets using: wrangler secret put <SECRET_NAME>
# CLERK_SECRET_KEY (required)
# CLERK_PUBLISHABLE_KEY (required)
# STRIPE_SECRET_KEY (required for payments)
# STRIPE_WEBHOOK_SECRET (required for Stripe webhooks)
# ADMIN_USER_ID (Clerk user ID of the admin: holds every admin scope when signed in, and alone issues hba_ admin keys)
# OAUTH_SIGNING_KEY (required for OAuth authorize/token/revoke flow)
# CLERK_WEBHOOK_SECRET (optional - enables POST /api/webhooks/clerk)
# CLOUDFLARE_ANALYTICS_TOKEN (read-only Account Analytics token, required for cost monitoring)
# CLOUDFLARE_ACCOUNT_ID (account ID, also needed at runtime by cost monitoring)
# COST_SAFETY_ALLOWANCE_ONLY=true (optional variable on this Worker; manual brake)
# COST_SAFETY_ALERT_CENTS / COST_SAFETY_BRAKE_CENTS (optional; defaults 2500 / 5000)
# ALERT_WEBHOOK_URL (optional - operator alert notifications, e.g. a Slack/Discord webhook)

# Durable Objects bindings
[[durable_objects.bindings]]
name = "CONTENT_METADATA"
class_name = "ContentMetadata"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "USER_PROFILES"
class_name = "UserProfile"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "PAYMENT_RECORDS"
class_name = "PaymentRecord"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "CONTEST_RECORDS"
class_name = "ContestRecord"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "MESSAGE_THREADS"
class_name = "MessageThread"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "PLATFORM_STATS"
class_name = "PlatformStats"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "ALERT_STORE"
class_name = "AlertStore"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "AUDIT_LOG"
class_name = "AuditLog"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "SUPPLIER_REGISTRY"
class_name = "SupplierRegistry"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "INFRASTRUCTURE_COST"
class_name = "InfrastructureCost"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "DELETION_RECORD"
class_name = "DeletionRecord"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "EXPIRATION_INDEX"
class_name = "ExpirationIndex"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "DISPUTE_RECORD"
class_name = "DisputeRecord"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "DISPUTE_INDEX"
class_name = "DisputeIndex"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "ADMIN_ACTION_LOG"
class_name = "AdminActionLog"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "APPLICATION_REGISTRY"
class_name = "ApplicationRegistry"
script_name = "hashbin-worker-prod"

[[durable_objects.bindings]]
name = "BACKUP_INDEX"
class_name = "BackupIndex"
script_name = "hashbin-worker-prod"

# R2 bucket bindings
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "hashbin-content-256t-prod"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "hashbin-backups-prod"

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContentMetadata", "UserProfile", "PaymentRecord", "ContestRecord", "MessageThread"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KeyRegistry"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PlatformStats", "AlertStore", "AuditLog"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SupplierRegistry"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["InfrastructureCost"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["DeletionRecord"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ExpirationIndex"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["DisputeRecord", "DisputeIndex", "AdminActionLog"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ApplicationRegistry"]

[[migrations]]
tag = "v10"
new_sqlite_classes = ["BackupIndex"]

# API keys carry their own signed route, so the key lookup table is no longer needed
[[migrations]]
tag = "v11"
deleted_classes = ["KeyRegistry"]

# Scheduled jobs (cron triggers)
[triggers]
crons = ["0 * * * *"]  # Hourly safety checks; maintenance at 02:00 UTC

# DOWNLOAD_TOKEN_SECRET: shared HMAC secret with 256t-content (required for new keys).
# COST_SAFETY_HARD_STOP=true: emergency 503 for all content downloads.
